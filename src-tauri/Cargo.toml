[workspace]
members = [".", "crates/ledger-core"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "UNLICENSED"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
thiserror = "2"

[package]
name = "pocket-ledger"
version.workspace = true
edition.workspace = true
description = "Local-first personal finance desktop app"
publish = false

[lib]
name = "pocket_ledger_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { workspace = true }
ledger-core = { path = "crates/ledger-core" }
