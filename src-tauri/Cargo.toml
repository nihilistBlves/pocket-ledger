[workspace]
members = [".", "crates/ledger-core"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "UNLICENSED"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
thiserror = "2"
rusqlite = { version = "0.41", features = ["bundled-sqlcipher-vendored-openssl"] }
rusqlite_migration = "2.7"
zeroize = { version = "1", features = ["derive"] }
getrandom = "0.4"
keyring = { version = "3", default-features = false, features = ["windows-native"] }
hex = "0.4"
tempfile = "3"

[package]
name = "pocket-ledger"
version.workspace = true
edition.workspace = true
description = "Local-first personal finance desktop app"
publish = false

[lib]
name = "pocket_ledger_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { workspace = true }
ledger-core = { path = "crates/ledger-core" }
serde_json = "1.0.154"
rusqlite = { workspace = true }
chrono = { version = "0.4.45", default-features = false, features = ["clock", "serde", "std"] }
tokio = { version = "1.54.1", features = ["sync", "time"] }
log = { version = "0.4.35", default-features = false }
tauri-plugin-opener = "2.7.2"
thiserror = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
