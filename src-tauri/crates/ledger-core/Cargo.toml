[package]
name = "ledger-core"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Domain logic for Pocket Ledger (money, dedup, transfers, categorization)"
publish = false

[dependencies]
serde = { workspace = true }
thiserror = { workspace = true }
rusqlite = { workspace = true }
rusqlite_migration = { workspace = true }
zeroize = { workspace = true }
getrandom = { workspace = true }
keyring = { workspace = true }
hex = { workspace = true }
unicode-normalization = "0.1"
csv = "1.4.0"
encoding_rs = "0.8.44"
sha2 = "0.11.1"
serde_json = "1.0.154"
calamine = "0.38.0"
scraper = "0.29.0"
tokio = { version = "1.54.1", features = ["rt", "macros", "time", "net", "io-util", "sync"] }
jsonwebtoken = { version = "12.0.0", default-features = false, features = ["rust_crypto", "use_pem"] }
log = { version = "0.4.35", default-features = false }
chrono = { version = "0.4.45", default-features = false, features = ["clock", "serde", "std"] }
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "json"] }

[dev-dependencies]
rsa = "0.10.0"
rust_xlsxwriter = "0.102.0"
tempfile = { workspace = true }
tokio = { version = "1.54.1", features = ["rt-multi-thread"] }
wiremock = "0.6.5"
