          <button type="button" data-theme="light" aria-pressed="false">Claro</button>
          <button type="button" data-theme="dark" aria-pressed="false">Oscuro</button>
          <button type="button" data-theme="system" aria-pressed="true">Sistema</button>
        </div>
      </div></div>
</main>
<script>(function(){var root=document.documentElement,btns=document.querySelectorAll('.theme-toggle button');
function cur(){var t=root.getAttribute('data-theme');return t==='light'||t==='dark'?t:'system';}
function paint(){var c=cur();btns.forEach(function(b){b.setAttribute('aria-pressed',String(b.dataset.theme===c));});}
btns.forEach(function(b){b.addEventListener('click',function(){var t=b.dataset.theme;if(t==='system')root.removeAttribute('data-theme');else root.setAttribute('data-theme',t);try{localStorage.setItem('pl-theme',t);}catch(e){}paint();});});paint();})();</script>
